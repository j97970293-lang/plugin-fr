name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true # first run: branch does not exist yet

      - name: Prepare builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILDS="$GITHUB_WORKSPACE/builds"
          # A failed checkout (branch does not exist yet) still leaves a repo
          # sitting on "master" — check the actual branch, not just .git.
          if [ ! -d "$BUILDS/.git" ] || [ "$(cd "$BUILDS" && git symbolic-ref -q --short HEAD)" != "builds" ]; then
            rm -rf "$BUILDS"
            mkdir -p "$BUILDS"
            cd "$BUILDS"
            git init -b builds
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cd "$BUILDS"
          rm -f *.cs3 *.jar plugins.json repo.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools-tmp"
          mv "$HOME/android-sdk/cmdline-tools-tmp/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          rm -rf "$HOME/android-sdk/cmdline-tools-tmp"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Generate repo.json
        run: |
          cat > $GITHUB_WORKSPACE/builds/repo.json << EOF
          {
            "name": "Plugin fr",
            "description": "Extensions CloudStream FR — 26 sources : AnimoFlix, Zenix, WaveWatch, Afterdark, FRAnime, French Stream, Flemmix, Vostfree, Anime-Sama, AnimeSite, CineStream, Purstream, 1JOUR1FILM, Movix, Frembed, Xalaflix (films, séries, animes, TV live FR + Madagascar + francophonie) et 9 extensions 18+ dont 5 françaises (Adkami Hentai, TrixHentai, Pornovore, Hentai-Fap, Hentai-VOSTFR) VF/VOSTFR",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend -m "Build $GITHUB_SHA" || true
          else
            git commit -m "Build $GITHUB_SHA" || true
          fi
          git push --force origin builds
