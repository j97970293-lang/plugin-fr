name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
        continue-on-error: true # first run: branch does not exist yet

      - name: Prepare builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILDS="$GITHUB_WORKSPACE/builds"
          # A failed checkout (branch does not exist yet) still leaves a repo
          # sitting on "master" — check the actual branch, not just .git.
          if [ ! -d "$BUILDS/.git" ] || [ "$(cd "$BUILDS" && git symbolic-ref -q --short HEAD)" != "builds" ]; then
            rm -rf "$BUILDS"
            mkdir -p "$BUILDS"
            cd "$BUILDS"
            git init -b builds
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cd "$BUILDS"
          rm -f *.cs3 *.jar plugins.json repo.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Generate repo.json
        run: |
          cat > $GITHUB_WORKSPACE/builds/repo.json << EOF
          {
            "name": "Plugin fr",
            "description": "Extension AnimoFlix pour CloudStream — animes, films & OAV en VF/VOSTFR",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/plugins.json"
            ]
          }
          EOF

      - name: Push builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            git commit --amend -m "Build $GITHUB_SHA" || true
          else
            git commit -m "Build $GITHUB_SHA" || true
          fi
          git push --force origin builds
